server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same ceiling as the backend expects; larger bodies are refused here with 413.
    client_max_body_size 1m;

    # The planner screen is one page; unknown paths fall back to it.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # /api/aggregate/release drives one full ERP round trip, and an idle ERP
    # instance cold-starts inside that round trip, so only this exact route
    # gets five minutes; every other /api/ route keeps the 60 s default.
    location = /api/aggregate/release {
        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The API is served same-origin through this proxy, so the browser needs no CORS and
    # the page reuses its own bearer token. The upstream is the compose service name.
    location /api/ {
        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
