scope: AIERP
area: parameter-write-back
title: "Parameter write-back"
summary: "A planner's accepted reorder-point decision changes nothing until someone retypes it into the ERP. The write-back closes that gap: an admin pushes accepted values into the ERP that owns the item-site. It covers BOTH ERPs (operator decision): Acumatica and Odoo."
items:
  - key: AIERP-D-126
    type: design
    title: "What is written"
    statement: "Each accepted drift decision that is still outstanding, meaning the ERP's reorder point differs from the accepted value by more than 1 unit."
    decided:
      by: model:claude
      date: 2026-10-28
      under: delegation
      ref: "AIERP#720"

  - key: AIERP-D-127
    type: design
    title: "What is written: Reorder point"
    statement: "**Reorder point:** the accepted value."
    decided:
      by: model:claude
      date: 2026-10-28
      under: delegation
      ref: "AIERP#720"

  - key: AIERP-D-128
    type: design
    title: "What is written: Max quantity"
    statement: "**Max quantity:** the accepted reorder point plus the item-site's current order quantity (max − min), so the order size does not change. When there is no order quantity, the max is the current max if that is not below the new reorder point, and the new reorder point otherwise."
    decided:
      by: model:claude
      date: 2026-10-28
      under: delegation
      ref: "AIERP#720"

  - key: AIERP-D-129
    type: design
    title: "What is written: Safety stock"
    statement: "**Safety stock:** not written. In both ERPs it does not drive a min/max reorder."
    decided:
      by: model:claude
      date: 2026-10-28
      under: delegation
      ref: "AIERP#720"

  - key: AIERP-D-130
    type: design
    title: "How it is written"
    statement: "**Acumatica:** the `ItemWarehouse` entity, whose `ReorderPoint` is the item-warehouse minimum. It takes two requests: one turns on the overrides, and a second sets the values. Values sent in the same request as the overrides are silently ignored (proven on the test tenant, on both seasonal and non-seasonal items). **Odoo:** the product-warehouse reorder rule (`stock.warehouse.orderpoint` min and max). AIERP never creates a rule, and it refuses when there are several rules for the pair."
    decided:
      by: model:claude
      date: 2026-10-28
      under: delegation
      ref: "AIERP#720"

  - key: AIERP-D-131
    type: design
    title: "Safeguards: Writes stay off unless each ERP's write switch is set."
    statement: "Writes stay off unless each ERP's write switch is set."
    decided:
      by: model:claude
      date: 2026-10-28
      under: delegation
      ref: "AIERP#720"

  - key: AIERP-D-132
    type: design
    title: "Safeguards: Every write is read back, and a mismatch"
    statement: "Every write is read back, and a mismatch is a failure, never a silent success."
    decided:
      by: model:claude
      date: 2026-10-28
      under: delegation
      ref: "AIERP#720"

  - key: AIERP-D-133
    type: design
    title: "Safeguards: Every attempt (written, unchanged or failed) is stored"
    statement: "Every attempt (written, unchanged or failed) is stored with who, before, requested and after."
    decided:
      by: model:claude
      date: 2026-10-28
      under: delegation
      ref: "AIERP#720"

  - key: AIERP-D-134
    type: design
    title: "Safeguards: A value already in place is not rewritten."
    statement: "A value already in place is not rewritten."
    decided:
      by: model:claude
      date: 2026-10-28
      under: delegation
      ref: "AIERP#720"

  - key: AIERP-D-135
    type: design
    title: "Safeguards: After a verified write, AIERP's own copy"
    statement: "After a verified write, AIERP's own copy of the item-site is updated, so the decision reads \"applied\" at once."
    decided:
      by: model:claude
      date: 2026-10-28
      under: delegation
      ref: "AIERP#720"

  - key: AIERP-D-136
    type: design
    title: "Odoo current values"
    statement: "AIERP also reads Odoo's reorder rules, so Odoo item-sites have a current reorder point to compare against (#714). Before that, Odoo's side of drift was blank."
    decided:
      by: model:claude
      date: 2026-10-28
      under: delegation
      ref: "AIERP#720"

  - key: AIERP-D-137
    type: design
    title: "Slices"
    statement: "#714–#719, then the planner screen."
    decided:
      by: model:claude
      date: 2026-10-28
      under: delegation
      ref: "AIERP#720"

  - key: AIERP-D-228
    type: design
    title: "How often a pushed value stays in the ERP"
    statement: "To show how often a pushed value is changed again in the ERP, AIERP takes, for each item-site, its latest push that left the ERP holding the pushed values (outcome written or unchanged). Once a sync has read the item-site after that push, the push is read back. It is unchanged while the ERP's reorder point and max both equal the values read back after the write, to within 0.000001, and changed otherwise, including when the ERP no longer holds a value. An item-site that no sync has read since its push is not read back yet. Pushes of an accepted reorder-point decision and of DDMRP buffer levels are counted apart. AIERP keeps no history of the ERP's values between syncs, so a value changed and changed back between two syncs counts as unchanged."
    decided:
      by: model:claude
      date: 2026-11-21
      under: delegation
      ref: "AISCP#1526"

  - key: AIERP-D-231
    type: design
    title: "Stop replenishing is carried out in the ERP"
    statement: "For an item-site whose current excess decision is accepted with the action `stop_replenishing`, while the item-site is on the dead-and-excess list, the parameter write-back proposes a reorder point of 0 and a max of 0 in the ERP that owns it, so the ERP's own replenishment raises no more orders. An admin confirms each push, as for every parameter push (AIERP-D-2). The push is outstanding while the ERP's reorder point or max is above 0: an item-site whose values are 0 or not set has nothing to stop. While the decision stands and the item-site is listed, this push replaces the item-site's reorder-point and buffer pushes, so neither undoes it; once the item-site leaves the list, or a later decision replaces this one, they return. Open orders are not cancelled (AIERP-D-101). The actions `reduce` and `dispose` change nothing in the ERP here: a transfer is released from the transfer suggestions, and scrapping, selling, returns and any write-down stay in the ERP and finance (AIERP-D-50). Each push records what it carried out (an accepted reorder-point decision, buffer levels, or a stop), and the record of pushes counts the three apart; a stop push is unchanged while the ERP holds 0 and 0."
    decided:
      by: model:claude
      date: 2026-11-23
      under: delegation
      ref: "AISCP#1588"

  - key: AIERP-D-232
    type: design
    title: "A buffered item-site is DDMRP-managed"
    statement: "A designated item-site whose buffer zones can be computed (its zone row's status is ok) is written from its buffer: the top of yellow as the reorder point and the top of green as the max. Its accepted reorder-point decision is never listed or written, whether or not the buffer's levels are already in the ERP, so the two pushes never undo each other. A designated item-site whose zones cannot be computed keeps its decision push."
    decided:
      by: model:claude
      date: 2026-11-23
      under: delegation
      ref: "AISCP#1586"
